org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Build-performance only. `parallel` lets Gradle configure and execute
# independent subprojects (the app module + the Flutter plugin's included
# builds) concurrently; `caching` moves task outputs into the shared build
# cache so an unchanged module is restored instead of re-run. Neither changes
# any produced artifact.
org.gradle.parallel=true
org.gradle.caching=true
# The Kotlin/Android compile tasks are the bulk of the build; incremental
# compilation is on by default for KGP but state it explicitly so a stale
# incremental cache is dropped by Gradle rather than reused.
kotlin.incremental=true
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
