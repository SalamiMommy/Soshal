name: soshal_flutter
description: Soshal - Native Rust social media app (Flutter port)
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  provider: ^6.1.1
  go_router: ^17.5.0
  path_provider: ^2.1.2
  battery_plus: ^6.2.3
  connectivity_plus: ^6.0.0
  video_player: ^2.8.0
  file_picker: ^12.0.0
  camera: ^0.12.0+2
  image: ^4.8.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  ffigen: ^21.0.0
  hooks: ^2.0.2
  native_assets_cli: ^0.10.0

  path_provider_platform_interface: any
  plugin_platform_interface: any
flutter:
  uses-material-design: true

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700

  # assets:
  #   - assets/images/
  #   - assets/icons/
