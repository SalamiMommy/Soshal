[package]
name = "soshal-flutter-bridge"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Core workspace dependencies
soshal-common-core = { path = "../common-core" }
soshal-nostr-core = { path = "../nostr-core" }
soshal-sync-core = { path = "../sync-core" }
soshal-crypto-core = { path = "../crypto-core" }
soshal-db-core = { path = "../db-core" }
soshal-media-core = { path = "../media-core" }
soshal-content-core = { path = "../content-core" }
soshal-identity-core = { path = "../identity-core" }
soshal-network-core = { path = "../network-core" }
soshal-relay-core = { path = "../relay-core" }
soshal-storage-core = { path = "../storage-core" }
soshal-feed-core = { path = "../feed-core" }
soshal-groups-core = { path = "../groups-core" }
soshal-social-core = { path = "../social-core" }
soshal-events-core = { path = "../events-core" }
soshal-marketplace-core = { path = "../marketplace-core" }
soshal-dating-core = { path = "../dating-core" }
soshal-search-core = { path = "../search-core" }
soshal-moderation-core = { path = "../moderation-core" }
soshal-analytics-core = { path = "../analytics-core" }
soshal-webrtc-core = { path = "../webrtc-core" }
soshal-spatial-core = { path = "../spatial-core" }
soshal-zap-core = { path = "../zap-core" }
soshal-streaming-core = { path = "../streaming-core" }
soshal-minis-core = { path = "../minis-core" }
soshal-audio-core = { path = "../audio-core" }
soshal-telemetry-core = { path = "../telemetry-core" }
soshal-layout-core = { path = "../layout-core" }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
nostr = { workspace = true }
nostr-sdk = { workspace = true }
ring = { workspace = true }
libsql = { workspace = true }
reqwest = { workspace = true }
keyring = { workspace = true }
rustls = { workspace = true }

# FFI-specific dependencies
flutter_rust_bridge = "=2.12.0"
jni = "0.21"
libc = { workspace = true }
ashpd = { version = "0.13", default-features = false, features = ["tokio", "location"] }
futures-util = { workspace = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
lazy_static = "1.4"
image = { workspace = true }
dirs = "5.0"
hex = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }
log = "0.4"

[lints]
workspace = true

[dev-dependencies]
soshal-test-util = { path = "../test-util" }
