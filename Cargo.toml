[workspace]
resolver = "2"
members = [
    "flutter-bridge",
    "common-core",
    "nostr-core",
    "sync-core",
    "crypto-core",
    "db-core",
    "media-core",
    "content-core",
    "identity-core",
    "network-core",
    "storage-core",
    "feed-core",
    "groups-core",
    "messaging-core",
    "social-core",
    "events-core",
    "marketplace-core",
    "pqc-core",
    "dating-core",
    "search-core",
    "notification-core",
    "moderation-core",
    "analytics-core",
    "webrtc-core",
    "spatial-core",
    "zap-core",
    "streaming-core",
    "minis-core",
    "audio-core",
    "telemetry-core",
    "layout-core",
    "relay-core",
    "test-util",
]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bytes = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "fs"] }
futures-util = "0.3"
libc = "0.2"
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
nostr = { version = "0.45.1", features = ["os-rng", "nip04", "nip47", "nip44"] }
nostr-sdk = { version = "0.45.1" }
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
hmac = "0.12"
regex = "1"
rayon = "1.10"
zeroize = { version = "1.8", features = ["derive", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
ring = "0.17"
aead = "0.5"
chacha20poly1305 = "0.10"
flate2 = "1.0"
zstd = "0.13"
getrandom = "0.4"
url = "2.5"
ml-kem = { version = "0.3.2", features = ["zeroize", "getrandom"] }
ml-dsa = "0.1.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# Turso libSQL embedded SQLite database engine & edge replication
libsql = { version = "0.10.0-pre.4", default-features = false, features = ["serde", "core"] }
geohash = "0.13"
rand = "0.8"
rand_core = "0.10"
# Platform keychain features are REQUIRED: without them keyring resolves to
# its in-memory mock store on every desktop platform and nsec / at-rest seal
# keys silently die with the process (and never persist across restarts).
# Linux: sync-secret-service (gnome-keyring/kwallet, disk-persistent) with
# keyutils fallback for headless sessions. Needs a running Secret Service at
# runtime; every keychain call site degrades gracefully when absent.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native", "sync-secret-service"] }
bip39 = { version = "2.1", default-features = false, features = ["std"] }
bip32 = "0.5"
pbkdf2 = "0.12"
subtle = "2"
# P2P media pipeline: content-defined chunking, SIMD-accelerated chunk
# hashing/verification, memory-mapped sparse downloads, zero-copy serving.
blake3 = "1"
fastcdc = "3"
memmap2 = "0.9"
nix = { version = "0.29", features = ["fs", "poll", "zerocopy"] }
# LAN discovery + NAT traversal for direct peer media transport.
mdns-sd = "0.13"
webrtc-ice = "0.14"
quinn = "0.11"
# Binary delta patching for feed sync (P2P deltas via prolly_sync).
# VCDIFF (RFC 3284, xdelta3-compatible) — wins over full payload for
# small feed JSON mutations; bsdiff's reference impl never shrinks.
oxidelta = "0.1"
# Blurred image placeholders sent inside metadata.
thumbhash = "0.1"

# Dev-profile optimization: debug builds are what `cargo test` and the Linux
# host bridge run under. opt-level=1 makes the ~1385-test suite and hot
# feed/mesh paths materially faster at a modest compile-time cost.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

[workspace.lints.rust]
unsafe_code = "deny"
# flutter_rust_bridge attribute macros expand `#[cfg(frb_expand)]` sections;
# rustc 1.96+ flags that cfg as unexpected in bridge crates.
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

# clippy 1.96's cloned_ref_to_slice_refs fires inside `#[frb]` macro-expanded
# serialize glue (clone of Vec args into slice refs) — generated code, not
# hand-written; the lint is noise here.
[workspace.lints.clippy]
cloned_ref_to_slice_refs = "allow"

