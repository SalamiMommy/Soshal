[workspace]
resolver = "2"
members = [
    "flutter-bridge",
    "common-core",
    "nostr-core",
    "sync-core",
    "crypto-core",
    "db-core",
    "media-core",
    "content-core",
    "identity-core",
    "network-core",
    "storage-core",
    "feed-core",
    "groups-core",
    "messaging-core",
    "mesh-core",
    "social-core",
    "events-core",
    "marketplace-core",
    "pqc-core",
    "dating-core",
    "search-core",
    "notification-core",
    "moderation-core",
    "analytics-core",
    "webrtc-core",
    "spatial-core",
    "zap-core",
    "streaming-core",
    "minis-core",
    "audio-core",
    "telemetry-core",
    "layout-core",
    "relay-core",
    "test-util",
]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bytes = { version = "1", features = ["serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync", "io-util", "fs"] }
futures-util = "0.3"
libc = "0.2"
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
nostr = { version = "0.45.1", features = ["os-rng", "nip04", "nip47", "nip44"] }
nostr-sdk = { version = "0.45.1" }
hex = "0.4"
base64 = "0.23"
sha2 = "0.10"
hmac = "0.12"
regex = "1"
rayon = "1.10"
zeroize = { version = "1.8", features = ["derive", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "socks"] }
ring = "0.17"
aead = "0.5"
chacha20poly1305 = "0.10"
flate2 = "1.0"
zstd = "0.13"
getrandom = "0.4"
url = "2.5"
ml-kem = { version = "0.3.2", features = ["zeroize", "getrandom"] }
ml-dsa = "0.1.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
# Turso libSQL embedded SQLite database engine & edge replication
libsql = { version = "0.10.0-pre.4", default-features = false, features = ["serde", "core"] }
geohash = "0.13"
rand = "0.8"
rand_core = "0.10"
# Platform keychain features are REQUIRED: without them keyring resolves to
# its in-memory mock store on every desktop platform and nsec / at-rest seal
# keys silently die with the process (and never persist across restarts).
# Linux: sync-secret-service (gnome-keyring/kwallet, disk-persistent) with
# keyutils fallback for headless sessions. Needs a running Secret Service at
# runtime; every keychain call site degrades gracefully when absent.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "linux-native", "sync-secret-service"] }
bip39 = { version = "2.1", default-features = false, features = ["std"] }
bip32 = "0.5"
pbkdf2 = "0.12"
subtle = "2"
# P2P media pipeline: content-defined chunking, SIMD-accelerated chunk
# hashing/verification, memory-mapped sparse downloads, zero-copy serving.
blake3 = "1"
fastcdc = "3"
memmap2 = "0.9"
nix = { version = "0.29", features = ["fs", "poll", "zerocopy"] }
# LAN discovery + NAT traversal for direct peer media transport.
mdns-sd = "0.13"
webrtc-ice = "0.14"
quinn = "0.11"
# Binary delta patching for feed sync (P2P deltas via prolly_sync).
# VCDIFF (RFC 3284, xdelta3-compatible) — wins over full payload for
# small feed JSON mutations; bsdiff's reference impl never shrinks.
oxidelta = "0.1"
# Blurred image placeholders sent inside metadata.
thumbhash = "0.1"
# On-device video frame moderation (moderation-core): ISO-BMFF demuxing
# (Mozilla's parser, production Firefox heritage) + pure-Rust H.264 and AV1
# decoders so the image NN can classify sampled frames of local AND remote
# videos. All safe-Rust first (rav1d-safe default builds forbid(unsafe)).
mp4parse = "0.17"
rust_h264 = "0.4"
rav1d-safe = "0.6"
# Pure-Rust WebAssembly interpreter for client plugins (minis-core).
wasmi = "2.0.0"
# IETF RFC 9591 / BIP-340 FROST threshold signatures on secp256k1 (crypto-core).
frost-secp256k1 = { version = "3.0.0", default-features = false, features = ["serde"] }
# Graph structures and algorithms for Web of Trust traversal (identity-core).
petgraph = "0.8.3"
# HTML parsing with CSS selectors for OpenGraph link previews (content-core).
scraper = "0.27.0"
# Standards-compliant HTML sanitization & XSS prevention (content-core).
ammonia = "4.2.0"
# Fast minimal HNSW maps for approximate nearest neighbor search (search-core).
instant-distance = "0.6.1"
# Lock-free concurrent hash maps for relay & sync engines (relay-core).
dashmap = "6.1.0"
# SIMD-accelerated UTF-8 stream validation (common-core).
simdutf8 = { version = "0.1.5", default-features = false, features = ["std"] }
# String similarity metrics & fuzzy matching for typo tolerance (search-core).
strsim = "0.11.1"
# SIMD-accelerated Bloom filter for mesh dedup & swarm sync (relay-core, network-core).
fastbloom = "0.17.0"
# iCalendar RFC 5545 recurrence rules for NIP-52 calendar events (events-core).
rrule = "0.14.0"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
# R*-tree spatial indexing for proximity lookups & geofencing (spatial-core).
rstar = { version = "0.13.0", default-features = false }
# Streaming CommonMark parser for rich text & NIP-23 articles (content-core).
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["simd"] }
# Magic-byte file type detection & MIME validation (media-core).
infer = { version = "0.22.0", default-features = false }
# 128-bit fixed-point decimal arithmetic for marketplace & payments (marketplace-core).
rust_decimal = { version = "1.43.0", default-features = false, features = ["serde"] }
# Atomic, lock-free GCRA rate limiter & traffic shaper (network-core, relay-core).
governor = { version = "0.10.4", default-features = false, features = ["std", "jitter"] }
# Probabilistic streaming algorithms (HLL, Count-Min Sketch) with bounded RAM (analytics-core).
streaming_algorithms = { version = "0.3.3", default-features = false }
# Compressed Roaring Bitmaps for high-speed set operations (sync-core).
roaring = { version = "0.11.5", default-features = false, features = ["std"] }
# Fast zero-dependency on-device natural language detection (content-core).
whichlang = "0.1.1"
# RFC 6238 Time-based One-Time Passwords for two-factor authentication (crypto-core).
totp-rs = { version = "6.0.0", default-features = false, features = ["gen_secret", "otpauth", "std"] }
# High Dynamic Range latency histograms with percentile tracking (telemetry-core).
hdrhistogram = { version = "7.6.0", default-features = false }
# Geospatial primitives, polygon containment & geodesic distance (spatial-core).
geo = { version = "0.33.1", default-features = false }
# Semantic Versioning 2.0.0 parsing and requirement matching (minis-core).
semver = { version = "1.0.28", default-features = false, features = ["std", "serde"] }
# High-performance, bounded O(1) LRU cache (feed-core).
lru = "0.18.2"
# High-quality, pure-Rust QR Code generator (crypto-core).
qrcodegen = "1.8.0"
# Snowball stemming algorithms for multilingual full-text search (search-core).
rust-stemmers = "1.2.0"
# Unicode Normalization Forms NFC/NFKC (content-core).
unicode-normalization = { version = "0.1.25", default-features = false, features = ["std"] }
# Perceptual color science, dominant palette extraction & WCAG contrast (media-core).
palette = { version = "0.7.7", default-features = false, features = ["std", "approx"] }
# Memory-compact Radix trie for O(k) prefix autocomplete (search-core).
radix_trie = "0.3.0"
# Strict RFC 5322 email address validation for NIP-05 & Lightning Addresses (identity-core).
email_address = { version = "0.2.9", default-features = false, features = ["serde"] }
# Fast Myers/Patience diffing for post edit history (content-core).
similar = { version = "3.2.0", default-features = false, features = ["std", "text"] }
# Advanced iterator adaptors & feed chunking (common-core).
itertools = "0.14.0"
# Type-safe bitmask flags for messages, permissions, and moderation (messaging-core).
bitflags = { version = "2.8.0", default-features = false, features = ["serde"] }
# Fast hardware-accelerated CRC32 checksums for P2P chunk verification (mesh-core).
crc32fast = "1.5.0"
# Safe, O(n) wildcard and shell-style pattern matching for mute lists and rules (moderation-core).
glob = "0.3.4"
# BCP-47 / CLDR language identifier parsing and canonicalization (content-core).
unic-langid = { version = "0.9.5", default-features = false }
# 128-bit millisecond-ordered lexicographically sortable identifiers (analytics-core).
ulid = { version = "1.2.0", default-features = false, features = ["std", "serde"] }
# High-speed XXHash non-cryptographic hashing (sync-core).
twox-hash = { version = "1.6.3", default-features = false }

# Dev-profile optimization: debug builds are what `cargo test` and the Linux
# host bridge run under. opt-level=1 makes the ~1385-test suite and hot
# feed/mesh paths materially faster at a modest compile-time cost.
[profile.dev]
opt-level = 1

# ...but *dependencies* are a different trade. serde_json, sha2, blake3, libsql
# and the crypto/decoder stack are where the actual per-event and per-frame work
# happens, and at opt-level=1 they are an order of magnitude slower than they
# need to be. This raises only third-party crates to opt-level=3; every
# `soshal-*` crate keeps inheriting `opt-level = 1` from [profile.dev] above, so
# workspace-crate rebuild times are unchanged.
#
# Deliberately NOT setting `panic`/`overflow-checks` here: the test harness
# needs unwinding, and `overflow-checks` is enforced in release by policy
# (see [profile.release] and the bridge-release note below).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

# Release profile for the Flutter FFI bridge cdylib specifically. The bridge
# is built once per Android ABI (arm64-v8a, x86_64, armeabi-v7a) plus the Linux
# host, and full-LTO + codegen-units=1 is the dominant cost in that loop —
# every one of the four builds pays single-CGU full-LTO codegen.
#
# Thin LTO still cross-crates inlines (which is what actually matters for the
# crypto and FFI boundary paths) but parallelizes codegen across units. The
# trade is a somewhat larger / slower .so, so `builds/android/build.sh` enforces
# an APK size budget to catch a regression rather than shipping it silently.
# `panic`, `strip`, and `overflow-checks` are inherited unchanged from release
# and must stay that way: overflow checks are deliberately on in release.
[profile.bridge-release]
inherits = "release"
lto = "thin"
codegen-units = 16

[workspace.lints.rust]
unsafe_code = "deny"
# flutter_rust_bridge attribute macros expand `#[cfg(frb_expand)]` sections;
# rustc 1.96+ flags that cfg as unexpected in bridge crates.
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(frb_expand)"] }

# clippy 1.96's cloned_ref_to_slice_refs fires inside `#[frb]` macro-expanded
# serialize glue (clone of Vec args into slice refs) — generated code, not
# hand-written; the lint is noise here.
[workspace.lints.clippy]
cloned_ref_to_slice_refs = "allow"

